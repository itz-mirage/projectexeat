<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mfantsipim School Exeat System</title>
    <link rel="stylesheet" href="internal.css">
</head>
<body>
<h3>Mfantsipim School Digital Exeat </h3>
<div class="title">
    <nav>
        <ul>
            <li><a href="homepage.html">Home</a></li>
            <li><a href="internal.html" class="active">Internal Exeat</a></li>
            <li><a href="external.html">External Exeat</a></li>
            <li><a href="announcement.html">Announcements</a></li>
        </ul>
    </nav>
</div>
<form class="exeat-form">
    <div class="input-form">
        <h1 id="head">Student information</h1>
        <hr>
        <label>Full Name</label>
        <input id="name" type="text" placeholder="Enter your full Name" required>
        <label>Class</label>
        <select required>
            <option value="">Select Class</option>
            <option value="S1">S1</option>
            <option value="S2">S2</option>
            <option value="S3">S3</option>
            <option value="S4">S4</option>
            <option value="S5">S5</option>
            <option value="S6">S6</option>
            <option value="S7">S7</option>
            <option value="S8">S8</option>
            <option value="S9">S9</option>
            <option value="S10">S10</option>
            <option value="S11">S11</option>
            <option value="S12">S12</option>
            <option value="S13">S13</option>
            <option value="S14">S14</option>
            <option value="S15">S15</option>
            <option value="S16">S16</option>
            <option value="S17">S17</option>
            <option value="S18">S18</option>
            <option value="A1">A1</option>
            <option value="A2">A2</option>
            <option value="A3">A3</option>
            <option value="A4">A4</option>
            <option value="A5">A5</option>
            <option value="A6">A6</option>
            <option value="A7">A7</option>
            <option value="A8">A8</option>
            <option value="T1">T1</option>
            <option value="T2">T2</option>
            <option value="T3">T3</option>
            <option value="T4">T4</option>
            <option value="V1">V1</option>
            <option value="V2">V2</option>

        </select>
        <label>House</label>
        <select required>
            <option value="">Select House</option>
            <option value="Balmer-Acquaah">Balmer-Acquaah</option>
            <option value="Pickard-Parker">Pickard-Parker</option>
            <option value="Lockhart-Schweitzer">Lockhart-Schweitzer</option>
            <option value="Sarbah-Picot">Sarbah-Picot</option>
            <option value="Freeman-Aggrey">Freeman-Aggrey</option>
            <option value="Bartels-Sneath">Bartels-Sneath</option>
            <option value="Brandful-Dontwi">Brandful-Dontwi</option>
            <option value="Abruquah-Monney">Abruquah-Monney</option>
        </select>
        <label>Year</label>
        <select required>
            <option value="">Select Year</option>
            <option value="SHS 1">SHS 1</option>
            <option value="SHS 2">SHS 2</option>
            <option value="SHS 3">SHS 3</option>
        </select>
    </div>
    <br>
    <div class="exeat-details">
        <h1 id="details">Exeat Details</h1>
        <hr>
        <label id="purp">Purpose</label>
        <input id="purpose" type="text" placeholder="State your reason clearly" required>
        <br>
        <br>
        <label>Destination</label>
        <br>
        <br>
        <input id="destination" type="text" placeholder="Enter your destination" required>
        <br>
        <br>
        <label>Departure Date</label>

        <input id="departure-date" type="date"  required>
        <label id="times">Time</label>
        <input type="time" placeholder="Enter your time" required>
        <label id="return">Return Date</label>
        <input  id="return-date" type="date"  required>

        <br>
        <br>
        <button id="submit">Submit Internal Exeat Request</button>

    </div>
</form>

<footer>
    <h5>Mfantsipim School-"Dwen Hwe Kan"</h5>
    <h4>Exeat Portal &copy; 2026| Cape Coast,Ghana| support:admin@mfantsipim.edu.gh </h4>
</footer>
</body>
</html>
